name: Release Publisher

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build macOS
    runs-on: macos-15
    env:
      APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B package --file pom.xml -P dist

      - name: Build macOS Vision Helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/bin
          swiftc -O native/macos-vision-scanner/main.swift \
            -target "x86_64-apple-macos12.0" \
            -framework Vision \
            -framework CoreGraphics \
            -framework ImageIO \
            -o "native/bin/qr-native-macos-x64"
          swiftc -O native/macos-vision-scanner/main.swift \
            -target "arm64-apple-macos12.0" \
            -framework Vision \
            -framework CoreGraphics \
            -framework ImageIO \
            -o "native/bin/qr-native-macos-arm64"

      - name: Import Apple Code Signing Certificate
        if: env.APPLE_CODESIGN_CERT_P12_BASE64 != '' && env.APPLE_CODESIGN_CERT_PASSWORD != '' && env.APPLE_CODESIGN_IDENTITY != ''
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-codesign
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/codesign-cert.p12"
          keychain_path="$RUNNER_TEMP/datashot-signing.keychain-db"

          echo "$APPLE_CODESIGN_CERT_P12_BASE64" | base64 -D > "$cert_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CODESIGN_CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Sign macOS Native Helpers
        if: env.APPLE_CODESIGN_CERT_P12_BASE64 != '' && env.APPLE_CODESIGN_CERT_PASSWORD != '' && env.APPLE_CODESIGN_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            binary_path="native/bin/qr-native-macos-${arch}"
            codesign --force --options runtime --timestamp --sign "$APPLE_CODESIGN_IDENTITY" "$binary_path"
            codesign --verify --strict --verbose=2 "$binary_path"
          done

      - name: Determine Release Version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ -z "$version" ]]; then
            version="$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare Upload Assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist-assets

          for arch in x64 arm64; do
            binary_src="native/bin/qr-native-macos-${arch}"
            binary_dst="dist-assets/qr-native-macos-${arch}"
            cp "$binary_src" "$binary_dst"
            chmod +x "$binary_dst"
          done

          fat_jar="$(find target -maxdepth 1 -type f -name '*-jar-with-dependencies.jar' | head -n1)"
          thin_jar="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-jar-with-dependencies.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)"

          if [[ -z "$fat_jar" ]]; then
            echo "Unable to locate fat JAR in target/." >&2
            exit 1
          fi

          cp "$fat_jar" "dist-assets/DataShot-${version}-app-with-dependencies.jar"
          if [[ -n "$thin_jar" ]]; then
            cp "$thin_jar" "dist-assets/DataShot-${version}-app.jar"
          fi

      - name: Notarize macOS Binaries
        if: env.APPLE_CODESIGN_CERT_P12_BASE64 != '' && env.APPLE_CODESIGN_CERT_PASSWORD != '' && env.APPLE_CODESIGN_IDENTITY != '' && env.APPLE_NOTARY_KEY_ID != '' && env.APPLE_NOTARY_ISSUER_ID != '' && env.APPLE_NOTARY_API_KEY_P8_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          echo "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 -D > "$key_path"

          for arch in x64 arm64; do
            binary_path="dist-assets/qr-native-macos-${arch}"
            notary_zip="$RUNNER_TEMP/$(basename "$binary_path").zip"

            ditto -c -k --sequesterRsrc --keepParent "$binary_path" "$notary_zip"
            xcrun notarytool submit "$notary_zip" \
              --key "$key_path" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist-assets/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"

      - name: Determine Changelog
        id: changelog_determiner
        run: |
          changelog="$(./bin/extract-changelog.sh CHANGELOG.md ${{ steps.get_version.outputs.VERSION }})"
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changelog" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist-assets

      - name: Create Release
        id: create_release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: ${{ steps.changelog_determiner.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Upload Release Assets
        id: upload_release
        if: success()
        uses: csexton/release-asset-action@v2
        with:
          pattern: "dist-assets/*"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-url: ${{ steps.create_release.outputs.upload_url }}
